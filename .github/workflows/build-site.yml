name: Собрать сайт

# Источник правды — markdown в корне. HTML в docs/ генерируется из него.
# Этот workflow не даёт им разойтись: на push в main пересобирает и коммитит,
# на pull request просто проверяет, что собранное совпадает с исходниками.

on:
  push:
    branches: [main]
    paths:
      - 'INTERVIEW_QA.md'
      - 'CV_REVIEW.md'
      - 'RESOURCES.md'
      - 'tools/**'
      - '.github/workflows/build-site.yml'
  pull_request:
    paths:
      - 'INTERVIEW_QA.md'
      - 'CV_REVIEW.md'
      - 'RESOURCES.md'
      - 'tools/**'
      - 'docs/roadmap.html'
  workflow_dispatch:

# Параллельные сборки одной ветки не нужны: последняя всё равно перекрывает предыдущую.
concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Собрать страницы
        run: |
          python3 tools/build_qa.py
          cd tools
          python3 build_page.py ../CV_REVIEW.md ../docs/cv-review.html \
            "Разбор резюме — Нурбол Хамзаулы" cv-review.html
          python3 build_page.py ../RESOURCES.md ../docs/resources.html \
            "Материалы: курсы, книги, видео, лабы" resources.html

      - name: Проверить, что вопросы не потерялись
        run: |
          # Число вопросов в markdown должно совпасть с числом карточек в HTML.
          md=$(grep -cE '^### [0-9]+\.' INTERVIEW_QA.md)
          html=$(grep -o 'class="q" id="q' docs/qa-trainer.html | wc -l)
          echo "в markdown: $md, в html: $html"
          test "$md" -eq "$html"
          test "$md" -gt 0
          # У каждого вопроса должен быть грейд, и он должен доехать до HTML.
          grades=$(grep -cE '^`Грейд` (junior|middle|senior)$' INTERVIEW_QA.md)
          hgrades=$(grep -o 'data-grade="' docs/qa-trainer.html | wc -l)
          echo "грейдов в markdown: $grades, в html: $hgrades"
          test "$md" -eq "$grades"
          test "$md" -eq "$hgrades"

      - name: Проверить, что roadmap покрывает все вопросы
        run: |
          python3 - <<'EOF'
          import io, re, collections, sys
          md = io.open("INTERVIEW_QA.md", encoding="utf-8").read()
          total = len(re.findall(r"(?m)^### \d+\. ", md))
          rm = io.open("docs/roadmap.html", encoding="utf-8").read()
          nums = []
          for spec in re.findall(r'q:"([^"]+)"', rm):
              for part in spec.split(","):
                  part = part.strip()
                  if "-" in part:
                      a, b = part.split("-")
                      nums += list(range(int(a), int(b) + 1))
                  elif part:
                      nums.append(int(part))
          c = collections.Counter(nums)
          dup = sorted(n for n, k in c.items() if k > 1)
          miss = [n for n in range(1, total + 1) if n not in c]
          extra = sorted(n for n in c if n < 1 or n > total)
          print("вопросов в markdown: %d, разложено по этапам: %d" % (total, len(c)))
          if dup:   print("дубли в этапах:", dup)
          if miss:  print("не попали ни в один этап:", miss)
          if extra: print("номера вне диапазона:", extra)
          sys.exit(1 if (dup or miss or extra) else 0)
          EOF

      # На pull request только проверяем: расхождение — это ошибка сборки,
      # потому что автор забыл пересобрать перед коммитом.
      - name: Проверить, что docs/ не отстал (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ не соответствует markdown. Запусти локально: python3 tools/build_qa.py"
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ актуален"

      # На push в main пересобранное просто коммитим обратно.
      - name: Закоммитить пересобранное (main)
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- docs/; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Пересобрать сайт из markdown [skip ci]"
          git push
